# Servidor de la web en producción (imagen `web` del Dockerfile). Cumple el
# papel de apps/web/vercel.json: la web y la API quedan en el mismo origen, así
# la cookie de sesión viaja sin configurar CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No anuncia la versión de nginx en las respuestas.
    server_tokens off;

    # Los planos SVG se suben hasta 5 MB (MAX_MAP_BYTES en la API).
    client_max_body_size 6m;

    # Comprime lo que más pesa: el JavaScript de la web y el plano SVG que
    # devuelve la API (casi 1 MB en la demostración).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/* va a la API sin el prefijo: /api/search?code=… → /search?code=…
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite pone un hash en el nombre de estos archivos: si cambian, cambia el
    # nombre, así que se pueden guardar en caché por mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sí se revisa siempre, para que una versión nueva se vea al
    # recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cualquier otra ruta (/acceso, /admin/esquemas/3) devuelve index.html y
    # React Router la resuelve en el navegador.
    location / {
        try_files $uri /index.html;
    }
}
